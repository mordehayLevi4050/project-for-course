name: groupay
description: "GrouPay: split group-trip expenses offline, Hebrew-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Versions are pinned exactly (see ARCHITECTURE-SPINE.md, Stack table).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: 1.4.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  go_router: 18.1.2
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.16.2
  drift_dev: 2.35.2
  riverpod_generator: 4.0.9

flutter:
  uses-material-design: true

  # google/fonts ships Heebo only as a variable font (wght 100-900). The same
  # file is registered for every weight DESIGN.md uses; core/ui/theme also sets
  # the matching `wght` FontVariation so the right instance is rendered.
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Heebo-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Heebo-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Heebo-VariableFont_wght.ttf
          weight: 800
